<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/cats.css}">
</head>

<body>
  <div th:replace="fragments/common.html :: header"></div>

  <section class="main-full">

    <div class="products-container">

      <div th:each="project : ${projects}">

        <div class="product-card">


          <div class="product-image">
            <img th:src="@{/images/{name} (name=${project.imageName})}" width="150px" height="150px"
              alt="project Image">
          </div>

          <div class="product-details">
            <a th:href="@{/projects/{id} (id=${project.id})}">
              <h2 th:text="${project.title}">project Name</h2>
              <p th:text="${project.description}">project Description</p>
            </a>
          </div>

        </div>

      </div>

    </div>

  </section>

  <div th:replace="fragments/common.html :: footer"></div>
  <script src="/js/loading.js"></script>
</body>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shayan Admin - Add</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin-panel.css">
  <link rel="stylesheet" href="/css/alerts.css">
</head>
<body th:class="${preferredTheme}">
    <div th:replace="fragments/common.html :: header"></div>
    <h1>Add new Service item</h1>
    <!-- Alerts -->
    <div class="alert" th:classappend="${alertType}" th:if="${showAlert}" id="alert">
        <button class="alert-close">&times;</button>
        <strong th:text="${alertTitle}">Success!</strong>
        <span th:text="${alertMessage}">Your action was completed successfully.</span>
        <div class="progress-bar">
            <div class="progress" id="alertProgress"></div>
        </div>
    </div>
    <!-- End of Alerts -->
    
    <form method="POST"
           th:action="@{/admin/projects/add}"
           th:object="${project}"
           enctype="multipart/form-data">
    
        <!-- Title Field -->
        <div class="form-group">
            <label th:field="*{title}">Title:</label>
            <input th:field="*{title}" type="text" class="form-control" />
        </div>

        <!-- Title Field -->
        <div class="form-group">
            <label th:field="*{description}">Title:</label>
            <input th:field="*{description}" type="text" class="form-control" />
        </div>

        <!-- Featured Checkbox -->
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" th:field="*{active}" class="form-check-input" />
                <label th:field="*{active}" class="form-check-label">
                    Activate this item
                </label>
            </div>
        </div>
        
        <!-- File Field (Note: Spring form tags don't have file input, use regular HTML) -->
        <div class="form-group">
            <label for="file">Upload Image:</label>
            <input type="file" id="file" name="file" accept="image/*" required />
        </div>
        
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <script src="/js/loading.js"></script>
    <script src="/js/admin-header.js"></script>
    <script src="/js/alerts.js"></script>
</body>
